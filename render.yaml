# ==============================================================================
# SiteSurveyor AI — Render Infrastructure as Code (render.yaml Blueprint)
# ==============================================================================
services:
  - type: web
    name: sitesurveyor-engine
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    # A container filesystem is discarded on every deploy and restart. Without a disk the
    # survey cache and every deliverable under /outputs is gone after each release, so the
    # map and KMZ links in the UI return 404 and each survey re-downloads its layers.
    # One disk per service is the platform limit, so both live under this single mount.
    disk:
      name: sitesurveyor-state
      mountPath: /app/state
      sizeGB: 1
    envVars:
      - key: SITESURVEYOR_STATE_DIR
        value: /app/state
      # No PORT here on purpose: Render assigns the container port and overrides a
      # pinned value, which would leave uvicorn listening somewhere the router never reaches.
      - key: GDAL_DISABLE_READDIR_ON_OPEN
        value: "EMPTY_DIR"
      # No MAP_DPI here: the export dpi that keeps a survey inside the starter plan's
      # 512 MB is set once, as the code default in src/config.py, and this file is only
      # read by blueprint deploys — services created with the CLI get no vars from it.
      - key: DE_AFRICA_TOKEN
        sync: false # Set your Digital Earth Africa API Key securely in Render Dashboard
      - key: ALLOWED_ORIGINS
        sync: false # Comma-separated https origins allowed to call /api/* cross-origin. Blank = CORS disabled (same-origin sandbox still works)
      - key: ALLOWED_HOSTS
        sync: false # Comma-separated hostnames for the MCP SSE transport. Setting any value enables DNS-rebinding protection; blank leaves it off for proxy hops

